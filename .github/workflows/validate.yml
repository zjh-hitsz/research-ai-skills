name: Validate public Skill repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: skills/file-intelligence
